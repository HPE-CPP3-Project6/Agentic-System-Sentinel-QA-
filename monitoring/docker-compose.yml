# Local monitoring stack for Sentinel-QA (Option A).
#
# The app itself runs on the HOST at :8080 (uvicorn). Only Prometheus and
# Grafana are containerized here; Prometheus scrapes the host via
# host.docker.internal. No cloud, no external egress.
#
#   cd monitoring && docker compose up -d
#   Prometheus -> http://localhost:9090   Grafana -> http://localhost:3000 (admin/admin)
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # host.docker.internal is native on Docker Desktop (Win/Mac); this mapping
    # makes it resolve on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
