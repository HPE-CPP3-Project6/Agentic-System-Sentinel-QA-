groups:
  - name: sentinel-qa
    rules:
      # The shim is unreachable (process down, crashed, or wrong port).
      - alert: TargetAppDown
        expr: up{job="sentinel-shim"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sentinel-QA shim is down"
          description: "Prometheus cannot scrape sentinel-shim (host.docker.internal:8080) for >1m."

      # More than a quarter of runs are failing over the last 10 minutes.
      - alert: HighRunFailureRate
        expr: |
          sum(rate(sentinel_run_failures_total[10m]))
            / clamp_min(sum(rate(sentinel_runs_total[10m])), 1) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High pipeline run failure rate"
          description: "More than 25% of runs have failed over the last 10m."

      # p95 end-to-end run time exceeds 10 minutes.
      - alert: SlowRun
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, mode) (rate(sentinel_run_duration_seconds_bucket[15m]))
          ) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow pipeline runs (p95 > 10m)"
          description: "95th-percentile run duration for mode {{ $labels.mode }} exceeds 600s."
